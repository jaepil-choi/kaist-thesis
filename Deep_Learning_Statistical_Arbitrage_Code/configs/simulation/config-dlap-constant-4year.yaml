# Major parameters
mode: "train"
results_tag: "replication"
debug: False
# Computation parameters
device: "cuda"
# Data parameters
output_dir: "./results/results-constant-4year-full-replication"
data_dir: "./data"
residuals_dir: "./residuals-replication"
start_date: "1998-01-02"
end_date: "2016-12-30"
use_comp_mtx: True
cap_proportion: 0.01
factor_models: {
    IPCA: [5],
    PCA: [5],
    FamaFrench: [5],
}
factor_model_settings: {
    IPCA: {
        directory: "ipca",
        residual_tag: "IPCA_DailyOOSresiduals",
        comp_mtx_tag: "IPCA_DailyMatrixOOSresiduals",
        initial_months: 420,
        window_size: 240,
        initial_oos_year: 1998,
        reestimation_freq: 12,
    },
    PCA: {
        directory: "pca",
        residual_tag: "AvPCA_OOSresiduals",
        comp_mtx_tag: "AvPCA_OOSMatrixresiduals",
        initial_months: 420,
        rolling_window: 60,
        covariance_window_size: 252,
        initial_oos_year: 1998,
    },
    FamaFrench: {
        directory: "famafrench",
        residual_tag: "DailyFamaFrench_OOSresiduals",
        comp_mtx_tag: "DailyFamaFrench_OOSMatrixresiduals",
        initial_months: 420,
        rolling_window: 60,
        initial_oos_year: 1998,
    },
}
# Training parameters
num_epochs: 100
optimizer_name: "Adam"
optimizer_opts: {
  lr: 0.001,
}
batch_size: 125
stride: 125
length_training: 1000  # size of rolling training window in trading days
rolling_retrain: False
initial_t: 0  # Start from beginning
early_stopping: False
objective: "sharpe"
validation_freq: 10
# Trading parameters
weight_policy: {
  type: "residuals",
  name: "normal",
}
holding_days: 1
# Market frictions parameters
trans_cost: 0
hold_cost: 0
# Other parameters
factor_model_tag: ""
signal_delay: 0
filter_assets_in_comp_mtx: False  # True to filter assets in the composition matrix to just those which will be used (True will confer a speedup)
gpu_data: True  # True to use GPU for all data processing of composition matrices in training loop; only enable if >36 GB GPU memory is available
disable_prefilter: True  # True to disable prefiltering of residuals (False will confer a speedup)
lag_comp_mtx: 1  # lag for comp mtx in days