random_seed: 2025

paper_contract:
  raw_start: 1978-01-01
  residual_start: 1998-01-01
  trading_start: 2002-01-01
  end: 2016-12-31
  cap_proportion: 0.01
  signal_lookback_days: 30
  training_window_days: 1000
  retrain_stride_days: 125
  transaction_cost: 0.0005
  short_holding_cost: 0.0001

data:
  stock_daily: data/kaist_pilot/canonical/common/korean_equity/adjusted_prices.parquet
  statement_facts: data/kaist_pilot/canonical/common/korean_equity/fng_statement_facts
  kimchi_factor_daily: data/kimchi-factor
  daily_share_counts: data/kaist_pilot/canonical/common/korean_equity/fng_daily_share_counts.parquet
  annual_share_counts: data/kaist_pilot/canonical/common/korean_equity/fng_annual_share_counts.parquet
  dividend_items: data/kaist_pilot/canonical/common/korean_equity/fng_dividend_items.parquet
  sector_classification: data/kaist_pilot/canonical/common/korean_equity/sector_classification.parquet
  risk_free_ecos_raw: data/kaist_pilot/canonical/guijarro_2025/ecos/raw/rf_cd_91d_daily_20150101_20260720.json
  kospi_index_ecos_raw: data/kaist_pilot/canonical/guijarro_2025/ecos/raw/kospi_index_daily_20180101_20260720.json
  security_master_pit: data/kaist_pilot/canonical/guijarro_2025/fng/raw/fgsc_market_rebalance_snapshots_201801_202606.csv
  risk_free_daily: guijarro-ordonez-2025-replication/outputs/kimchi-exact/daily_market_rf.csv
  kospi_return_daily: guijarro-ordonez-2025-replication/outputs/kimchi-exact/daily_market_rf.csv
  factor_returns_daily: guijarro-ordonez-2025-replication/outputs/kimchi-exact/daily_factor_returns.csv
  statement_announcement_history: null
  bid_ask_daily: null
  shortability_daily: null
  borrow_cost_daily: null

korea_pilot:
  available_start: 2015-01-02
  available_end: 2026-07-20
  branch: exact_kimchi_methodology_price_return_non_pit_outputs_available
  daily_fama_french_8_common_start: 2020-01-02

factor_models:
  fama_french:
    methodology_document: docs/kimchi-factor-methodology.md
    factors: [1, 3, 5, 8]
    loading_window_days: 60
    reporting_lag_months: 3
    accounting_vintage: non_pit_latest_snapshot_sensitivity
    annual_rebalance_month: 6
    breakpoint_reference_market: KOSPI
    eligible_markets: [KOSPI, KOSDAQ]
    common_stock_only: true
    exclude_spac: true
    exclude_rebalance_halts: true
    exclude_financials_for: [SMB, HML, RMW, CMA]
    include_financials_for: [MOM]
    output_weights: [value_weighted, equal_weighted]
    output_frequencies: [daily, monthly]
    daily_weight: prior_trading_day_market_cap
    breakpoints:
      size: 0.50
      characteristic: [0.30, 0.70]
  pca:
    factors: [1, 3, 5, 8, 10, 15]
    covariance_window_days: 252
    loading_window_days: 60
  ipca:
    factors: [1, 3, 5, 8, 10, 15]
    initial_months: 420
    characteristic_window_months: 240
    reestimate_every_months: 12
    max_iterations: 1500
    tolerance: 0.001
    characteristic_count: 46
    reporting_lag_months: 3
    short_history_window_months: 60
    missing_characteristic_policy: explicit_cross_sectional_median_rank
    warning_labels: [NON_PIT_3M_LAG, SHORT_HISTORY_IPCA, PROXY_CHARACTERISTICS]

gates:
  price_total_return_verified: false
  price_return_excludes_cash_dividend: true
  market_cap_basis_verified: false
  market_cap_formula_recomputed_and_verified: true
  delisting_and_corporate_actions_verified: false
  pit_security_master_available: true
  daily_risk_free_available: true
  kospi_return_series_available: true
  ebitda_component_mapping_verified: true
  direct_ebitda_mapping_verified: false
  statement_account_mapping_verified: true
  daily_fama_french_factors_available: true
  exact_kimchi_price_return_non_pit_outputs_available: true
  korea_pilot_daily_fama_french_8_available: true
  ipca_240_month_history_available: false
  historical_statement_announcement_times_available: false
  all_46_characteristics_available: false
  korea_46_characteristic_builder_available: true
  ipca_short_history_sensitivity_available: false
  bid_ask_available: false
  shortability_and_borrow_cost_available: false

outputs:
  root: guijarro-ordonez-2025-replication/outputs
