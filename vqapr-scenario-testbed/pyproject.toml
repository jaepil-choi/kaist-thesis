[project]
name = "vqapr-scenario-testbed"
version = "0.1.0"
description = "Scenario friction evaluation: can a first-time vqapr user carry out a given scenario on their own, and tell vqapr's friction from their own?"
requires-python = ">=3.12"
dependencies = [
    "vqapr==0.2.0a2",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.0",
    "numpy>=1.26",
]

# The exact wheel under test. The version and filename must match what `uv build` in ../../qlibx
# actually produced; 0.2.0a2 is the version qlibx declared on 2026-09-02 and is a placeholder until
# the post-convergence wheel exists. See README.md, Protocol step 0.
[tool.uv.sources]
vqapr = { path = "../../qlibx/dist/vqapr-0.2.0a2-py3-none-any.whl" }
